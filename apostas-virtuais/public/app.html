<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Evlurn</title>
<link rel="stylesheet" href="/css/style.css">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0D1117">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Evlurn">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
</head>
<body>

  <!-- ══════════════════════════════════════
       HEADER GLOBAL
  ══════════════════════════════════════ -->
  <header class="ev-header">
    <a href="/" class="ev-header-logo">EVLURN</a>

    <div class="ev-header-xp-wrap">
      <div class="ev-header-xp-info">
        <span class="ev-header-nivel" id="hdr-nivel">Nv. 1</span>
        <span class="ev-header-xp-txt" id="hdr-xp-txt">0 / 100 XP</span>
      </div>
      <div class="ev-header-xp-bar">
        <div class="ev-header-xp-prog" id="hdr-xp-prog" style="width:0%"></div>
      </div>
    </div>

    <div class="ev-header-saldo">
      <div class="ev-header-saldo-ico"></div>
      <span class="ev-header-saldo-val numero" id="hdr-saldo">—</span>
      <span class="ev-header-saldo-lbl">EVC</span>
    </div>

    <div class="ev-header-actions">
      <button class="ev-header-btn ev-header-notif" id="btn-notif" title="Notificações">
        Notif.
        <span class="ev-notif-badge" id="notif-badge" style="display:none">0</span>
      </button>
      <button class="ev-header-btn sair" id="btn-sair" title="Sair">Sair</button>
    </div>
  </header>

  <!-- ══════════════════════════════════════
       SIDEBAR DE NAVEGAÇÃO (desktop)
  ══════════════════════════════════════ -->
  <aside class="ev-sidebar" id="ev-sidebar">

    <div class="ev-nav-section">
      <button class="ev-nav-item ativo" data-secao="inicio" id="nav-inicio">
        <span class="ev-nav-ico">⌂</span>Início
      </button>
      <button class="ev-nav-item" data-secao="conhecimento">
        <span class="ev-nav-ico">◎</span>Conhecimento
      </button>
      <button class="ev-nav-item" data-secao="missoes">
        <span class="ev-nav-ico">✓</span>Missões
      </button>
      <button class="ev-nav-item" data-secao="conquistas">
        <span class="ev-nav-ico">◆</span>Conquistas
      </button>
      <button class="ev-nav-item" data-secao="jogos">
        <span class="ev-nav-ico">▷</span>Jogos
      </button>
    </div>

    <div class="ev-nav-divider"></div>

    <div class="ev-nav-section">
      <span class="ev-nav-label">Conta</span>
      <button class="ev-nav-item" data-secao="perfil">
        <span class="ev-nav-ico">○</span>Perfil
      </button>
    </div>

    <div class="ev-nav-divider"></div>

    <div class="ev-nav-section">
      <span class="ev-nav-label">Plataforma</span>
      <a href="/seja-criador.html" class="ev-nav-item ev-nav-criador" target="_blank">
        <span class="ev-nav-ico">✦</span>Seja Criador
      </a>
      <button class="ev-nav-item" data-secao="sobre">
        <span class="ev-nav-ico">ℹ</span>Sobre
      </button>
    </div>

    <div class="ev-sidebar-spacer"></div>

    <div class="ev-nav-section" style="padding-bottom:8px;">
      <div style="padding:8px 10px;font-size:11px;color:var(--texto-terciario);line-height:1.4;">
        <span id="sidebar-usuario-nome" style="font-weight:600;color:var(--texto-secundario);display:block;margin-bottom:2px;"></span>
        v0.8.2-beta
      </div>
    </div>

  </aside>

  <!-- ══════════════════════════════════════
       CONTEÚDO PRINCIPAL
  ══════════════════════════════════════ -->
  <div class="ev-layout">
    <main class="ev-main" id="ev-main">
      <!-- carregado dinamicamente -->
    </main>
  </div>

  <!-- ══════════════════════════════════════
       NAV INFERIOR (mobile)
  ══════════════════════════════════════ -->
  <nav class="ev-nav-mobile">
    <button class="ev-nav-mobile-item ativo" data-secao="inicio">
      <span class="ev-nav-mobile-ico">⌂</span>Início
    </button>
    <button class="ev-nav-mobile-item" data-secao="missoes">
      <span class="ev-nav-mobile-ico">✓</span>Missões
    </button>
    <button class="ev-nav-mobile-item" data-secao="jogos">
      <span class="ev-nav-mobile-ico">▷</span>Jogos
    </button>
    <button class="ev-nav-mobile-item" data-secao="conquistas">
      <span class="ev-nav-mobile-ico">◆</span>Conquistas
    </button>
    <button class="ev-nav-mobile-item" data-secao="perfil">
      <span class="ev-nav-mobile-ico">○</span>Perfil
    </button>
  </nav>

  <!-- overlay de modais -->
  <div id="modal-overlay"></div>

  <script src="/js/common.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
