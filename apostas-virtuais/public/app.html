<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Evlurn</title>
<link rel="stylesheet" href="/css/style.css">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0D1117">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Evlurn">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
</head>
<body>

  <!-- ══════════════════════════════════════
       HEADER GLOBAL — sempre visível
  ══════════════════════════════════════ -->
  <header class="header-global">
    <div class="header-logo">
      <img src="/icons/icon-192.png" alt="Evlurn" style="width:28px;height:28px;border-radius:6px;flex-shrink:0;">
      <span style="background:linear-gradient(135deg,#00B4FF,#7B5CFF);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:0.06em;">EVLURN</span>
    </div>

    <div class="header-avatar-wrap" id="header-avatar-wrap">
      <div class="header-avatar" id="header-avatar">🎮</div>
      <span class="header-patente" id="header-patente"></span>
    </div>

    <div class="header-xp-wrap">
      <div class="header-xp-info">
        <span class="header-nivel" id="header-nivel">Nv. 1</span>
        <span class="header-xp-texto" id="header-xp-texto">0 / 100 XP</span>
      </div>
      <div class="header-xp-barra">
        <div class="header-xp-progresso" id="header-xp-progresso" style="width:0%"></div>
      </div>
    </div>

    <div class="header-saldo">
      <span class="header-saldo-icone">◈</span>
      <span class="header-saldo-valor numero" id="header-saldo">—</span>
    </div>

    <button class="header-notif" id="btn-notif" title="Notificações">
      🔔
      <span class="notif-badge" id="notif-badge" style="display:none;">0</span>
    </button>

    <button class="header-sair" id="btn-sair" title="Sair">⏻</button>
  </header>

  <!-- ══════════════════════════════════════
       LAYOUT DA PLATAFORMA
  ══════════════════════════════════════ -->
  <div class="layout-plataforma">

    <!-- Sidebar de Mundos (desktop) -->
    <aside class="sidebar-mundos" id="sidebar-mundos">
      <button class="mundo-btn ativo" data-mundo="arena">
        <span class="mundo-btn-icone">🎮</span>
        <span class="mundo-btn-label">Arena</span>
      </button>
      <button class="mundo-btn" data-mundo="academia">
        <span class="mundo-btn-icone">📚</span>
        <span class="mundo-btn-label">Academia</span>
        <span class="em-breve-tag">Em breve</span>
      </button>
      <button class="mundo-btn" data-mundo="oficina">
        <span class="mundo-btn-icone">🛠️</span>
        <span class="mundo-btn-label">Oficina</span>
        <span class="em-breve-tag">Em breve</span>
      </button>
      <button class="mundo-btn" data-mundo="explorar">
        <span class="mundo-btn-icone">🌍</span>
        <span class="mundo-btn-label">Explorar</span>
        <span class="em-breve-tag">Em breve</span>
      </button>
      <button class="mundo-btn" data-mundo="perfil">
        <span class="mundo-btn-icone">👤</span>
        <span class="mundo-btn-label">Perfil</span>
      </button>
    </aside>

    <!-- Conteúdo principal -->
    <main class="mundo-main" id="mundo-main">
      <!-- carregado dinamicamente pelo app.js -->
    </main>

  </div>

  <!-- Nav inferior de Mundos (mobile) -->
  <nav class="nav-mundos-mobile">
    <button class="mundo-btn-mobile ativo" data-mundo="arena">
      <span class="mundo-btn-mobile-icone">🎮</span>
      Arena
    </button>
    <button class="mundo-btn-mobile" data-mundo="academia">
      <span class="mundo-btn-mobile-icone">📚</span>
      Academia
    </button>
    <button class="mundo-btn-mobile" data-mundo="oficina">
      <span class="mundo-btn-mobile-icone">🛠️</span>
      Oficina
    </button>
    <button class="mundo-btn-mobile" data-mundo="explorar">
      <span class="mundo-btn-mobile-icone">🌍</span>
      Explorar
    </button>
    <button class="mundo-btn-mobile" data-mundo="perfil">
      <span class="mundo-btn-mobile-icone">👤</span>
      Perfil
    </button>
  </nav>

  <!-- Painel de Missões (overlay lateral) -->
  <div id="missoes-overlay" style="display:none;"></div>

  <script src="/js/common.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
