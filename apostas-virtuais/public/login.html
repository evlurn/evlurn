<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Entrar — Evlurn</title>
<link rel="stylesheet" href="/css/style.css">
  <!-- PWA / Evlurn -->
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0D1117">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Evlurn">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
</head>
<body>
  <div class="tela-auth">
    <div class="auth-caixa">
      <div class="auth-marca">
        <div style="margin-bottom:16px;">
          <img src="/icons/icon-192.png" alt="Evlurn" style="width:64px;height:64px;border-radius:14px;">
        </div>
        <h1 style="font-size:28px;letter-spacing:0.04em;background:linear-gradient(135deg,#00B4FF,#7B5CFF);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;">EVLURN</h1>
        <p style="font-size:12px;letter-spacing:0.12em;color:#484F58;text-transform:uppercase;">Learn &nbsp;·&nbsp; Earn &nbsp;·&nbsp; Evolve</p>
      </div>

      <div class="card">
        <div id="alerta-area"></div>
        <form id="form-login">
          <div class="campo">
            <label for="apelido">Apelido</label>
            <input type="text" id="apelido" name="apelido" autocomplete="username" placeholder="seu apelido" required>
          </div>
          <div class="campo">
            <label for="senha">Senha</label>
            <input type="password" id="senha" name="senha" autocomplete="current-password" placeholder="••••••••" required>
          </div>
          <button type="submit" class="btn btn-primario btn-bloco" id="btn-entrar">Entrar</button>
        </form>
      </div>

      <p class="auth-rodape">Ainda não tem conta? <a href="/register.html" style="color:#fff; font-weight:600;">Cadastre-se</a></p>
      <div style="display:flex;gap:16px;justify-content:center;margin-top:14px;">
        <a href="/conheca.html" style="font-size:12px;color:var(--texto-terciario,#484F58);text-decoration:none;" onmouseover="this.style.color='#8B949E'" onmouseout="this.style.color='#484F58'">Conheça a Evlurn</a>
        <span style="color:#30363D;">·</span>
        <a href="/seja-criador.html" style="font-size:12px;color:var(--texto-terciario,#484F58);text-decoration:none;" onmouseover="this.style.color='#8B949E'" onmouseout="this.style.color='#484F58'">Seja Criador</a>
      </div>
    </div>
  </div>

  <script src="/js/common.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
